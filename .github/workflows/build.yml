name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          set -e
          mkdir proj
          cd proj
          w(){ mkdir -p "$(dirname "$1")"; base64 -d > "$1"; }
          echo aW1wb3J0IHJlYWN0IGZyb20gJ0B2aXRlanMvcGx1Z2luLXJlYWN0JwppbXBvcnQgeyBkZWZpbmVDb25maWcgfSBmcm9tICd2aXRlJwpleHBvcnQgZGVmYXVsdCBkZWZpbmVDb25maWcoeyBiYXNlOiAnLi8nLCBwbHVnaW5zOiBbcmVhY3QoKV0gfSkK | w 'web/vite.config.js'
          echo ZXhwb3J0IGRlZmF1bHQgeyBjb250ZW50OiBbJy4vaW5kZXguaHRtbCcsICcuL3NyYy8qKi8qLnt0cyx0c3h9J10sIHRoZW1lOiB7IGV4dGVuZDoge30gfSwgcGx1Z2luczogW10gfQo= | w 'web/tailwind.config.js'
          echo  | w 'web/index.html'
          echo ZXhwb3J0IGRlZmF1bHQgeyBwbHVnaW5zOiB7IHRhaWx3aW5kY3NzOiB7fSwgYXV0b3ByZWZpeGVyOiB7fSB9IH0K | w 'web/postcss.config.js'
          echo  | w 'web/package.json'
          echo  | w 'web/src/Home.tsx'
          echo  | w 'web/src/index.css'
          echo  | w 'web/src/main.tsx'
          echo cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC41LjInIGFwcGx5IGZhbHNlIH0K | w 'android/build.gradle'
          echo b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bQphbmRyb2lkLnVzZUFuZHJvaWRYPXRydWUK | w 'android/gradle.properties'
          echo cGx1Z2luTWFuYWdlbWVudCB7IHJlcG9zaXRvcmllcyB7IGdvb2dsZSgpOyBtYXZlbkNlbnRyYWwoKTsgZ3JhZGxlUGx1Z2luUG9ydGFsKCkgfSB9CmRlcGVuZGVuY3lSZXNvbHV0aW9uTWFuYWdlbWVudCB7IHJlcG9zaXRvcmllcyB7IGdvb2dsZSgpOyBtYXZlbkNlbnRyYWwoKSB9IH0Kcm9vdFByb2plY3QubmFtZSA9ICJOYXFxYWwiCmluY2x1ZGUgJzphcHAnCg== | w 'android/settings.gradle'
          echo  | w 'android/app/build.gradle'
          echo  | w 'android/app/src/main/AndroidManifest.xml'
          echo  | w 'android/app/src/main/java/com/naqqal/app/MainActivity.java'
          echo  | w 'android/app/src/main/java/com/naqqal/app/InstallReceiver.java'
          echo PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj7ZhtmC2ZHYp9mEPC9zdHJpbmc+PC9yZXNvdXJjZXM+Cg== | w 'android/app/src/main/res/values/strings.xml'
      - name: Build web UI
        working-directory: proj/web
        run: |
          npm install --no-audit --no-fund
          npx vite build
      - name: Copy UI into Android
        run: |
          mkdir -p proj/android/app/src/main/assets/www
          cp -r proj/web/dist/. proj/android/app/src/main/assets/www/
      - name: Build APK
        working-directory: proj/android
        run: gradle assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" proj/android/app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY" --title "Naqqal APK" --notes "ready"
